# CI/CD of the observability stack. The steps live in the organization's shared workflow (RSO-ekipa10/.github,
# .github/workflows/service-ci-cd.yml, ADR-051); this file only says when it runs and with which settings. The stack has no code and
# no image of its own (four official charts, two ConfigMaps of provisioning files, three NetworkPolicies and a smoke test), so it
# calls the shared workflow with build-image: false, like the broker: no Node.js steps, no image build, push or digest, and the chart
# gets no image values. The rules of the stack that the shared workflow does not know stay in chart-ci.yml.
#   pull request   job "pipeline / test": workflow lint, Helm 4, chart lint and schema check (dev and prod values),
#                  helm test hook; job "chart-rules / test": workflow lint, the four charts pinned and vendored,
#                  strict chart lint, manifests against the Kubernetes schemas, the values schema's refusals, the rules of the stack
#   push to main   the same checks, then the Helm deploy of the chart to the namespace monitoring, the smoke test (helm test) and
#                  the rollback when it fails; the job "pipeline" starts only when "chart-rules" passed
#   manual run     redeploy or roll back to the chart of an earlier commit of main (input "sha")
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Redeploy or roll back to the chart of this full commit SHA from main (empty = newest commit)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Pull requests: a newer push cancels the older run. Main and manual runs from main share one group, and a newer run never
  # cancels a running one (a killed "helm upgrade" leaves the release stuck).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    # The job id "pipeline" calling the job "test" gives the check name "pipeline / test", the name the branch ruleset requires.
    needs: chart-rules
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.chart-rules.result == 'success') }}
    permissions:
      contents: read
      id-token: write # Azure login with OIDC in the deploy job
    # Like the broker and the services: @main until the first reviewed release tag of the shared workflow exists, then pin this line
    # to the commit SHA of that tag (a commit that has the input build-image, or a later one).
    uses: tmp-tmppp/.github/.github/workflows/service-ci-cd.yml@main
    with:
      service: observability # also the Helm release name, and so the name of the Secret observability-env
      namespace: monitoring # the namespace of the stack (README, "Namespace"); it is created once by hand, the workflow checks it
      build-image: false
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      sha: ${{ inputs.sha }}
    secrets:
      # Named secrets only (no "inherit"): the shared workflow gets nothing else. No Docker Hub token (nothing is pushed).
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The organization secret OBSERVABILITY_ENV: KEY=value lines that become the Secret observability-env in the namespace
      # monitoring. Needed: admin-user and admin-password (Grafana's administrator). Optional: smtp-user and smtp-password (README, "Alerts").
      app-env: ${{ secrets.OBSERVABILITY_ENV }}

  chart-rules:
    # The checks of the stack itself, in chart-ci.yml (the job id test inside it gives "chart-rules / test").
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/chart-ci.yml
