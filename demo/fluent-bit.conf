[SERVICE]
    Daemon Off
    Flush 2
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020

# Docker's fluentd logging driver delivers every line of a container as {container_name, container_id, source, log}.
[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224

# The same step as "Merge_Log On" of the cluster's kubernetes filter: a line that is a JSON object becomes the fields of the record.
[FILTER]
    Name parser
    Match *
    Key_Name log
    Parser json
    Reserve_Data On
    Preserve_Key Off

# The same output as the cluster's (helm/values.yaml, fluent-bit.config.outputs), with the labels' sources adapted to a record that
# has no Kubernetes metadata: namespace is the fixed value prod (the dashboards and alert rules filter on it), app is the JSON field
# service, tenant is the JSON field tenantId (a line without it gets no tenant label). Not mirrored here: the cluster's unlimited
# retry and its buffer on disk (storage.type filesystem, Retry_Limit no_limits), which need a folder on a node; a demo that loses
# a few lines while Loki restarts is acceptable.
[OUTPUT]
    Name loki
    Match *
    Host loki
    Port 3100
    Labels job=fluent-bit, namespace=prod, app=$service, tenant=$tenantId
    Remove_Keys container_id,source
    Line_Format json
    Retry_Limit 5
