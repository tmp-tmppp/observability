# The same dashboard provider as the chart (helm/values.yaml, grafana.dashboardProviders); the files are helm/dashboards/.
apiVersion: 1
providers:
  - name: chance
    orgId: 1
    folder: Chance
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/chance
