# Loki for the compose demo: the chart's settings (helm/values.yaml, loki.loki) without the Kubernetes parts (no memberlist
# service, the ring lives in memory). Single binary, filesystem storage, 72 hours of retention, a 50 MB results cache.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 72h
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  volume_enabled: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
compactor:
  working_directory: /loki/retention
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50
analytics:
  reporting_enabled: false
