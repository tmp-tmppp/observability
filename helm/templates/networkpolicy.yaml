{{- if .Values.networkPolicy.enabled }}
# Who may connect inside the namespace `monitoring`. Ingress only (no egress rule: Fluent Bit and Prometheus call the API
# server, Prometheus calls the services in the namespace prod, Grafana calls Loki and Prometheus). Nothing from another
# namespace is admitted, and the smoke test Pod of this release is the one other client. A person reaches Grafana with
# kubectl port-forward, which enters the Pod through the node's container runtime and is not filtered by a NetworkPolicy.
# Needs a network policy engine in the cluster (plan section 9); without one the objects do nothing.
#
# Loki (3100): the Fluent Bit Pods push, Grafana queries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["fluent-bit", "grafana"]
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: 3100
          protocol: TCP
---
# Prometheus (9090): Grafana queries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: 9090
          protocol: TCP
---
# Grafana (3000): only the smoke test; people use kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: 3000
          protocol: TCP
{{- end }}
